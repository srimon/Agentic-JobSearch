groups:
  - name: jobsearch
    rules:
      - alert: JobsearchTargetDown
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Jobsearch telemetry target is unavailable"}
      - alert: JobsearchSourceStale
        expr: time() - jobsearch_source_last_success_seconds > 28800
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Source has no successful collection in eight hours"}
      - alert: JobsearchWorkerStalled
        expr: time() - jobsearch_worker_heartbeat_seconds{job="jobsearch-worker"} > 1020
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Collector has stopped reporting progress"}
      - alert: JobsearchDatabaseMetricsUnavailable
        expr: jobsearch_database_metrics_up == 0
        for: 2m
        annotations: {summary: "Database-backed metrics cannot be collected"}
      - alert: JobsearchSchedulerStalled
        expr: time() - jobsearch_scheduler_heartbeat_seconds{job="jobsearch-scheduler"} > 120
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Scheduler has stopped completing scheduling passes"}

  - name: jobsearch-recording
    rules:
      - record: jobsearch:api_requests:rate5m
        expr: sum by(route) (rate(jobsearch_http_requests_total[5m]))
      - record: jobsearch:api_latency_seconds:p95_1h
        expr: histogram_quantile(0.95, sum by(le) (rate(jobsearch_http_duration_seconds_bucket[1h])))
