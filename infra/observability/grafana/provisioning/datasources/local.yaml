apiVersion: 1
datasources:
  - name: Jobsearch Prometheus
    uid: jobsearch-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Jobsearch Loki
    uid: jobsearch-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
  - name: Jobsearch Tempo
    uid: jobsearch-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
