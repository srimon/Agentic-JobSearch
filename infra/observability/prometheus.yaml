global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: jobsearch-api
    static_configs:
      - targets: [api:9108]
  - job_name: jobsearch-worker
    static_configs:
      - targets: [worker:9108]
  - job_name: jobsearch-scheduler
    static_configs:
      - targets: [scheduler:9108]
