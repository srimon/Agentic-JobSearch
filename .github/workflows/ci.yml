name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_migration_readiness.py evaluation/test_training_source_directory.py evaluation/test_analytics_slack.py evaluation/test_retired_staging_paths.py evaluation/test_production_recovery.py -q
      - run: python -m unittest evaluation.test_learning evaluation.test_email_report evaluation.test_email_secret evaluation.test_scheduled_email evaluation.test_email_tracking evaluation.test_collection_completeness evaluation.test_application_summaries
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  worker-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobsearch_owner
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: jobsearch_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobsearch_owner -d jobsearch_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JOBSEARCH_AUTH_TEST: '1'
      JOBSEARCH_TELEMETRY: 'false'
      # Disposable CI-only service credential; never a deployment credential.
      JOBSEARCH_DATABASE_URL: postgresql://jobsearch_owner:ephemeral_ci_only@127.0.0.1:5432/jobsearch_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/test_database.py
      - run: python -m pytest tests/test_worker_leases.py tests/test_collection_observability.py tests/test_intake.py tests/test_local_auth.py tests/test_collection.py tests/test_block_urls.py tests/test_dice.py tests/test_public_feeds.py tests/test_observability.py tests/test_lifecycle.py tests/test_observability_panel.py -q
