# Requires migration 013 and a drained legacy worker. See docs/playbooks/worker-leases.md.
services:
  api:
    image: jobsearch-observability:20260912
    volumes:
      - ./.secrets/grafana_viewer_token:/run/secrets/grafana_viewer_token:ro
  worker:
    image: jobsearch-leased:20260912
    deploy:
      replicas: 1
    stop_grace_period: 75s
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/tmp/jobsearch-worker-heartbeat').st_mtime<int(os.getenv('JOBSEARCH_WORKER_MAX_RUN_SECONDS','900'))+120"]
  scheduler:
    image: jobsearch-leased:20260912
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: [python, -m, ai_core.agents.scheduler]
    stop_grace_period: 75s
    cpus: 0.5
    mem_limit: 256m
    networks: [data, observability]
    env_file: [.secrets/worker.env]
    environment: {JOBSEARCH_TELEMETRY: "true"}
    volumes: [telemetry_logs:/app/telemetry]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/tmp/jobsearch-scheduler-heartbeat').st_mtime<600"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  phoenix:
    image: arizephoenix/phoenix@sha256:f8a80ff0ffb5ae394846baffaa0cc90b3add4e0f3515eaa968ca11079137bca4
    restart: unless-stopped
    init: true
    cpus: 1
    mem_limit: 1g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [data, observability]
    env_file: [.secrets/phoenix.env]
    environment:
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: 'false'
      PHOENIX_WORKING_DIR: /tmp/phoenix
      PHOENIX_HOST_ROOT_PATH: /api/monitoring/phoenix
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  grafana:
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3105/api/monitoring/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'false'
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.external-url=http://localhost:3105/api/monitoring/prometheus/
      - --web.route-prefix=/
