# Requires migration 013 and a drained legacy worker. See docs/playbooks/worker-leases.md.
services:
  api:
    image: jobsearch-leased:20260912
  worker:
    image: jobsearch-leased:20260912
    deploy:
      replicas: 1
    stop_grace_period: 75s
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/tmp/jobsearch-worker-heartbeat').st_mtime<int(os.getenv('JOBSEARCH_WORKER_MAX_RUN_SECONDS','900'))+120"]
  scheduler:
    image: jobsearch-leased:20260912
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: [python, -m, ai_core.agents.scheduler]
    stop_grace_period: 75s
    cpus: 0.5
    mem_limit: 256m
    networks: [data, observability]
    env_file: [.secrets/worker.env]
    environment: {JOBSEARCH_TELEMETRY: "true"}
    volumes: [telemetry_logs:/app/telemetry]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/tmp/jobsearch-scheduler-heartbeat').st_mtime<600"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
